<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="fyreGrad" x1="6" y1="28" x2="26" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF1E00"/>
      <stop offset="45%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>
    <linearGradient id="linkGrad" x1="12" y1="12" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE4CC"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#FF5500" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle for contrast in both dark and light browser chrome -->
  <rect width="32" height="32" rx="8" fill="#0A0E1A" stroke="#1E2738" stroke-width="1"/>

  <!-- Flame with integrated interlocking link motif -->
  <g filter="url(#glow)">
    <!-- Main Flame silhouette -->
    <path d="M16 3.5C16 3.5 20 8 20 12C20 14.2 18.8 15.6 17.8 16.5C19 16 21 15 22 16.8C23.5 19.2 23.2 22 21.6 24.2C19.8 26.8 16 28 16 28C16 28 12.2 26.8 10.4 24.2C8.8 22 8.5 19.2 10 16.8C11 15 13 16 14.2 16.5C13.2 15.6 12 14.2 12 12C12 8 16 3.5 16 3.5Z" fill="url(#fyreGrad)"/>
    
    <!-- Interlocking chain link symbol inside flame -->
    <path d="M13.8 14.8L15.3 13.3C16.3 12.3 17.9 12.3 18.9 13.3C19.9 14.3 19.9 15.9 18.9 16.9L17.4 18.4" stroke="url(#linkGrad)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18.2 17.2L16.7 18.7C15.7 19.7 14.1 19.7 13.1 18.7C12.1 17.7 12.1 16.1 13.1 15.1L14.6 13.6" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
