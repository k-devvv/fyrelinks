<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.5"/>
  </filter>
  <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="12" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  
      <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2d3748"/><stop offset="100%" stop-color="#1a202c"/></linearGradient>
    
</defs>
<rect width="1200" height="750" fill="#121417"/>
<rect width="1200" height="750" fill="url(#grid)"/>
<circle cx="1050" cy="100" r="320" fill="#ecc94b" opacity="0.08" filter="url(#softGlow)"/>
<circle cx="150" cy="650" r="280" fill="#ecc94b" opacity="0.05" filter="url(#softGlow)"/>
<text x="50" y="65" font-family="monospace, 'Courier New', monospace" font-size="14" fill="#ecc94b" letter-spacing="3" font-weight="600">HARDWARE / VRAM, PCIE LANES &amp; LOCAL COMPUTE PC</text>

