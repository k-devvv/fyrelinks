          <rect x="20" y="280" width="320" height="115" rx="6" fill="#1e2430" stroke="#3182ce"/>
          <text x="35" y="308" font-family="monospace" font-size="11" fill="#63b3ed" font-weight="bold">CRITICAL EVALUATION RULE:</text>
