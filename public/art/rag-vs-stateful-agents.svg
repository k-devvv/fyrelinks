<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" fill="none">
  <defs>
    <linearGradient id="ragBg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0e15"/>
      <stop offset="100%" stop-color="#131924"/>
    </linearGradient>
    <linearGradient id="boxRag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162030"/>
      <stop offset="100%" stop-color="#0e1420"/>
    </linearGradient>
    <linearGradient id="boxAgent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241a28"/>
      <stop offset="100%" stop-color="#120e17"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#ragBg)"/>
  <rect width="1200" height="750" fill="none" stroke="#242d3e" stroke-width="2"/>

  <!-- Top Title -->
  <text x="70" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#ff8056">SYSTEM ARCHITECTURE / DECISION FRAMEWORK</text>
  <text x="70" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#f3f5f9" letter-spacing="-0.5">Simple RAG Pipeline vs. Stateful Autonomous Agents</text>
  <text x="70" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">When deterministic vector retrieval beats unpredictable multi-turn agent loops</text>

  <!-- Left Column: Simple RAG (Single-Pass Deterministic) -->
  <g transform="translate(70, 185)">
    <rect width="515" height="495" rx="12" fill="url(#boxRag)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="25" y="25" width="130" height="24" rx="6" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
    <text x="90" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#60a5fa">DETERMINISTIC &amp; FAST</text>
    
    <text x="25" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f3f5f9">Simple RAG Workflow</text>
    <text x="25" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Single-turn retrieval augmented generation</text>

    <!-- Linear Flow Diagram -->
    <g transform="translate(25, 135)">
      <!-- Step 1 -->
      <rect width="465" height="48" rx="8" fill="#0b0e14" stroke="#1f293d"/>
      <text x="20" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">1. User Query &amp; Embedding</text>
      
      <!-- Arrow -->
      <text x="232" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#60a5fa">↓</text>

      <!-- Step 2 -->
      <g transform="translate(0, 75)">
        <rect width="465" height="48" rx="8" fill="#0b0e14" stroke="#1f293d"/>
        <text x="20" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">2. Top-K Vector Search (Cosine Similarity)</text>
      </g>

      <!-- Arrow -->
      <text x="232" y="141" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#60a5fa">↓</text>

      <!-- Step 3 -->
      <g transform="translate(0, 150)">
        <rect width="465" height="48" rx="8" fill="#0b0e14" stroke="#1f293d"/>
        <text x="20" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">3. Synthesize Grounded Answer + Citations</text>
      </g>
    </g>

    <!-- Telemetry -->
    <g transform="translate(25, 365)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
      <text x="0" y="20">• End-to-End Latency: <tspan font-weight="700" fill="#34d399">&lt; 1.5 seconds</tspan></text>
      <text x="0" y="45">• Token Consumption: <tspan font-weight="700" fill="#34d399">1x baseline (Predictable)</tspan></text>
      <text x="0" y="70">• Debugging: Direct inspection of retrieved chunks</text>
      <text x="0" y="95">• Best For: Internal documentation, product FAQs, policy lookup</text>
    </g>
  </g>

  <!-- Right Column: Stateful Agents (Multi-Turn Loops) -->
  <g transform="translate(615, 185)">
    <rect width="515" height="495" rx="12" fill="url(#boxAgent)" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.6"/>
    <rect x="25" y="25" width="130" height="24" rx="6" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1"/>
    <text x="90" y="41" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f472b6">DYNAMIC &amp; COMPLEX</text>
    
    <text x="25" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f3f5f9">Stateful Agent Loops</text>
    <text x="25" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">Multi-turn tool calling, memory state &amp; reflection</text>

    <!-- Cyclical Flow Box -->
    <g transform="translate(25, 135)">
      <rect width="465" height="200" rx="10" fill="#0d0912" stroke="#2d1b38"/>
      
      <circle cx="232" cy="100" r="65" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="6 4"/>
      
      <text x="232" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f472b6">PLAN &amp; DECOMPOSE</text>
      <text x="365" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">EXECUTE TOOL</text>
      <text x="232" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f472b6">EVALUATE RESULT</text>
      <text x="100" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">MUTATE STATE</text>

      <text x="232" y="104" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ff8056">LOOP N TIMES</text>
    </g>

    <!-- Telemetry -->
    <g transform="translate(25, 365)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
      <text x="0" y="20">• End-to-End Latency: <tspan font-weight="700" fill="#f59e0b">8 – 35+ seconds</tspan></text>
      <text x="0" y="45">• Token Consumption: <tspan font-weight="700" fill="#ef4444">4x – 12x multiplier</tspan></text>
      <text x="0" y="70">• Debugging: Non-deterministic branching &amp; tool state</text>
      <text x="0" y="95">• Best For: Multi-API data extraction, coding workflows, DB mutations</text>
    </g>
  </g>
</svg>
