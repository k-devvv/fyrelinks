# The homepage and /live aggregate ten RSS feeds. The site is a static export,
# so those headlines are only as fresh as the last build: this workflow is what
# replaces request-time revalidation.
#
# Builds here rather than in Cloudflare Pages Build, so the cadence is limited by
# GitHub Actions minutes rather than the 500 Pages builds a month on the free
# plan. `wrangler pages deploy` is a direct upload and uploads functions/ too.
#
# Note: GitHub disables scheduled workflows in a repository with no activity for
# 60 days. If headlines go stale, check that first.
name: Rebuild and deploy

on:
  schedule:
    - cron: "0 */2 * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify content and types
        run: npm run check

      - name: Build static export
        run: npm run build
        env:
          # Build-time only. The /go/ affiliate variables are read by the Pages
          # Function at request time, so they belong in the Pages project.
          NEXT_PUBLIC_AD_FRAME_ORIGIN: ${{ vars.NEXT_PUBLIC_AD_FRAME_ORIGIN }}

      # Until the Pages project exists, a missing token would fail every
      # scheduled run and bury real failures in noise. Checking first keeps the
      # rebuild useful as a check-and-build signal while setup is in progress.
      - name: Is Cloudflare Pages configured?
        id: target
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$PROJECT" ] && [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy: set the CLOUDFLARE_PROJECT_NAME variable and the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets."
          fi

      # The ad frame must load from a different origin than the site (see
      # lib/advertising.ts), so it ships alone to its own Pages project. Only
      # /ads/frame.html and its header rule go there, never the whole site.
      - name: Deploy ad frame to its own Pages project
        if: steps.target.outputs.ready == 'true' && vars.CLOUDFLARE_AD_PROJECT_NAME != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AD_PROJECT: ${{ vars.CLOUDFLARE_AD_PROJECT_NAME }}
        run: |
          mkdir -p ad-out/ads
          cp out/ads/frame.html ad-out/ads/frame.html
          printf '/ads/frame.html\n  Content-Security-Policy: frame-ancestors https://www.fyrelinkz.com https://fyrelinkz.com\n  X-Robots-Tag: noindex, nofollow\n' > ad-out/_headers
          npx --yes wrangler@4 pages project list | grep -qw "$AD_PROJECT"             || npx --yes wrangler@4 pages project create "$AD_PROJECT" --production-branch main
          npx --yes wrangler@4 pages deploy ad-out --project-name "$AD_PROJECT" --branch main

      - name: Deploy to Cloudflare Pages
        if: steps.target.outputs.ready == 'true'
        run: npx --yes wrangler@4 pages deploy out --project-name "${{ vars.CLOUDFLARE_PROJECT_NAME }}" --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
